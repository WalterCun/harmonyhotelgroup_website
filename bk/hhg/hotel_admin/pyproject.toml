[project]
name = "hotel_admin"
version = "0.1.0"
description = "hotel_admin using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.165.1,<1.0.0"
]

[project.scripts]
hotel_admin = "hotel_admin.main:run"
run_crew = "hotel_admin.main:run"
train = "hotel_admin.main:train"
replay = "hotel_admin.main:replay"
test = "hotel_admin.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
